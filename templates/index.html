<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف المشاعر في الوقت الفعلي</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .video-container {
            margin: 20px 0;
        }

        .video-feed {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>كشف المشاعر في الوقت الفعلي</h1>
        <button id="startButton" class="start-button">بدء الكشف عن المشاعر</button>
        <div class="video-container" style="display: none;">
            <img src="{{ url_for('video_feed') }}" alt="بث الفيديو" class="video-feed">
        </div>
    </div>

    <script>
        document.getElementById('startButton').addEventListener('click', function () {
            const videoContainer = document.querySelector('.video-container');
            const startButton = document.getElementById('startButton');

            if (videoContainer.style.display === 'none') {
                videoContainer.style.display = 'block';
                startButton.textContent = 'إيقاف الكشف عن المشاعر';
                startButton.classList.add('active');
            } else {
                videoContainer.style.display = 'none';
                startButton.textContent = 'بدء الكشف عن المشاعر';
                startButton.classList.remove('active');
            }
        });
    </script>
</body>

</html>
